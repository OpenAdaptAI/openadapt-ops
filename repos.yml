# Repositories aggregated into the docs site.
#
# These entries feed the aggregated Changelog and the What's New digest.
# They intentionally do NOT set `doc_page`: the docs site presents a single
# curated Ecosystem page (docs/ecosystem/index.md) rather than mirroring each
# repo's README, which drifts out of sync with the product. Add `doc_page:
# packages/<name>.md` to an entry only if you want its README mirrored as a
# published page.
#
# Internal developer tooling (openadapt-desktop, openadapt-consilium,
# openadapt-wright, openadapt-herald, openadapt-crier) is intentionally omitted
# so a product evaluator sees the product, not the toolshed.
repos:
  - name: OpenAdapt
    github: OpenAdaptAI/OpenAdapt
    category: core
    changelog: true

  - name: openadapt-flow
    github: OpenAdaptAI/openadapt-flow
    category: core
    changelog: true

  - name: openadapt-agent
    github: OpenAdaptAI/openadapt-agent
    category: core
    changelog: true

  - name: openadapt-ml
    github: OpenAdaptAI/openadapt-ml
    category: core
    changelog: true

  - name: openadapt-evals
    github: OpenAdaptAI/openadapt-evals
    category: core
    changelog: true

  - name: openadapt-capture
    github: OpenAdaptAI/openadapt-capture
    category: core
    changelog: true

  - name: openadapt-privacy
    github: OpenAdaptAI/openadapt-privacy
    category: library
    changelog: true

  - name: openadapt-types
    github: OpenAdaptAI/openadapt-types
    category: library
    changelog: true

  - name: openadapt-grounding
    github: OpenAdaptAI/openadapt-grounding
    category: library
    changelog: true

  - name: openadapt-retrieval
    github: OpenAdaptAI/openadapt-retrieval
    category: library
    changelog: true

  - name: openadapt-viewer
    github: OpenAdaptAI/openadapt-viewer
    category: library
    changelog: true
