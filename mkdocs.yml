site_name: OpenAdapt Docs
site_description: >-
  OpenAdapt takes the last manual step off your team. It enters approved
  information into the systems you already use, such as EMRs, payer portals,
  and desktop and Citrix apps, and checks that it saved. When something doesn't
  match, it stops and asks a person instead of guessing.
site_url: https://docs.openadapt.ai
# The header star/fork counter reads from repo_url. Point it at the flagship
# repo so it reflects the project's real GitHub traction, not this docs repo.
repo_url: https://github.com/OpenAdaptAI/OpenAdapt
repo_name: OpenAdaptAI/OpenAdapt
# Docs live in this openadapt-ops repo, not the flagship code repo above, so
# the per-page "edit" link would 404. Disable it rather than point it wrong.
edit_uri: ''
copyright: >-
  &copy; 2023&ndash;2026 OpenAdapt.AI and MLDSAI Inc. &middot;
  <a href="https://openadapt.ai">OpenAdapt.ai</a> &middot;
  <a href="https://blog.openadapt.ai">Blog</a> &middot;
  <a href="https://openadapt.ai/security">Security</a>

theme:
  name: material
  # Register the local overrides directory so overrides/main.html can inject the
  # PostHog snippet and shared analytics event layer via the extrahead block.
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.ico
  # Match the public site's local system stacks and avoid a third-party font
  # request on documentation pages. The canonical tokens define the stacks and
  # brand.css maps them onto both Material font vars.
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - toc.integrate
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight

extra_css:
  # The canonical OpenAdapt design tokens, vendored byte-identical from
  # OpenAdaptAI/openadapt-web. Load them FIRST: brand.css consumes them and
  # defines no colour of its own. See the VENDORED.txt beside the copies.
  - stylesheets/vendor/openadapt-web/tokens.css
  - stylesheets/brand.css

extra_javascript:
  - javascripts/production-lifecycle.js

plugins:
  - search

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  generator: false
  # Analytics. See ANALYTICS.md (repo root) for the full data-handling notes.
  # Google Analytics is env-driven; the fallback keeps the existing measurement
  # ID working when GOOGLE_ANALYTICS_KEY is unset. GA measurement IDs are public
  # (non-secret), so committing the fallback is fine. The GA script itself is
  # overrides/partials/integrations/analytics/google.html: it honors
  # Do-Not-Track and turns Google signals off.
  analytics:
    provider: google
    property: !ENV [GOOGLE_ANALYTICS_KEY, "G-CJ01Y19XJN"]
  # PostHog is read at BUILD time. When NEXT_PUBLIC_POSTHOG_KEY is unset (local
  # builds and CI), posthog_key is "" and overrides/main.html emits no PostHog
  # script at all. Reuses the same env var names and host as the marketing site
  # so every property reports into one PostHog project.
  posthog_key: !ENV [NEXT_PUBLIC_POSTHOG_KEY, ""]
  posthog_host: !ENV [NEXT_PUBLIC_POSTHOG_HOST, "https://us.i.posthog.com"]
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/OpenAdaptAI
    - icon: fontawesome/brands/discord
      link: https://discord.gg/yF527cQbDG
    - icon: fontawesome/solid/globe
      link: https://openadapt.ai
    - icon: fontawesome/solid/rss
      link: https://blog.openadapt.ai

# Information architecture (Diataxis). Evaluate is the plain-language business
# path, with no install. Get started has three separate tracks: the command
# line, the Desktop app, and an agent over MCP. Concepts explain, How-to guides
# instruct, and Reference describes. Security & procurement holds the review,
# data-handling, and commercial pages. Contributing & research keeps
# contributor and research pages out of the customer sections.
#
# Every page appears in exactly one section. Pages keep their on-disk paths, so
# no published URL changes; only their grouping does. A page that does move
# leaves a `redirect_to` stub at its old path (see overrides/main.html).
#
# Guessed-path alias. Built so /start/ redirects; keep it off the nav.
not_in_nav: |
  /start/index.md
  /evaluate/glossary.md
nav:
  - Home: index.md
  - Evaluate:
    - evaluate/index.md
    - Four workflows, before and after: evaluate/before-after.md
    - What you see and control: evaluate/what-you-see.md
    - Security and where data stays: evaluate/security.md
    - How a first project works: evaluate/first-project.md
  - Get started:
    - get-started/index.md
    - Command line: get-started/cli.md
    - Desktop app: desktop/install.md
    - Connect an agent over MCP: get-started/agent-mcp.md
    - Author a workflow: get-started/first-workflow.md
    - What you get: get-started/what-you-get.md
  - Concepts:
    - concepts/index.md
    - How a workflow is built:
      - The demonstration compiler: concepts/demonstration-compiler.md
      - The workflow-program IR: concepts/workflow-ir.md
      - Multi-trace induction: concepts/multi-trace-induction.md
