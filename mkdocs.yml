markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  generator: false
  # Analytics. See ANALYTICS.md (repo root) for the full data-handling notes.
  # Google Analytics is env-driven; the fallback keeps the existing measurement
  # ID working when GOOGLE_ANALYTICS_KEY is unset. GA measurement IDs are public
  # (non-secret), so committing the fallback is fine. The GA script itself is
  # overrides/partials/integrations/analytics/google.html: it honors
  # Do-Not-Track and turns Google signals off.
  analytics:
    provider: google
    property: !ENV [GOOGLE_ANALYTICS_KEY, "G-CJ01Y19XJN"]
  # PostHog is read at BUILD time. When NEXT_PUBLIC_POSTHOG_KEY is unset (local
  # builds and CI), posthog_key is "" and overrides/main.html emits no PostHog
  # script at all. Reuses the same env var names and host as the marketing site
  # so every property reports into one PostHog project.
  posthog_key: !ENV [NEXT_PUBLIC_POSTHOG_KEY, ""]
  posthog_host: !ENV [NEXT_PUBLIC_POSTHOG_HOST, "https://us.i.posthog.com"]
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/OpenAdaptAI
    - icon: fontawesome/brands/discord
      link: https://discord.gg/yF527cQbDG
    - icon: fontawesome/solid/globe
      link: https://openadapt.ai
    - icon: fontawesome/solid/rss
      link: https://blog.openadapt.ai

# Information architecture (Diataxis). Developers is split into Tutorials
# (learning by doing), How-to guides (one task each), Reference (facts to look
# up), and Explanation (why it works this way). Security & procurement is a
# separate section for reviewers who won't install anything.
#
# Every page appears in exactly one section. Old URLs redirect through the
# mkdocs-redirects map in `plugins` above.
nav:
  - Home: index.md
  - Developers:
      - Tutorials:
          - Quickstart: tutorials/quickstart.md
          - Automate your first workflow: tutorials/first-workflow.md
      - How-to guides:
          - Record a demonstration: how-to/record.md
          - Build from several demonstrations: how-to/combine-demonstrations.md
          - Add record checks: how-to/record-checks.md
          - Certify and qualify: how-to/certify-and-qualify.md
          - Run a workflow: how-to/run.md
          - Handle a halt: how-to/handle-a-halt.md
          - Connect an agent: how-to/connect-an-agent.md
          - Install the desktop app: how-to/desktop.md
          - Deploy: how-to/deploy.md
          - Troubleshoot: how-to/troubleshoot.md
      - Reference:
          - Run outcomes: reference/outcomes.md
          - Commands: reference/cli.md
          - Configuration: reference/configuration.md
          - Files and evidence: reference/artifacts.md
          - Packages: reference/packages.md
          - Versions and compatibility: reference/compatibility.md
          - Glossary: reference/glossary.md
          - Changelog: changelog.md
          - What's new: whats-new.md
      - Explanation:
          - How OpenAdapt works: explanation/how-it-works.md
          - How a save is checked: explanation/verification.md
          - Surfaces: explanation/surfaces.md
          - Limits: explanation/limits.md
  - Security & procurement:
      - Overview: security/index.md
      - Data handling: security/data-handling.md
      - Deployment boundaries: security/deployment-boundaries.md
      - Evidence: security/evidence.md
      - Subprocessors: security/subprocessors.md
      - Release integrity: security/release-integrity.md
      - Engagements: security/engagements.md
      - Execute: security/execute.md
      - Account security: security/account-security.md
      - Procurement FAQ: security/procurement-faq.md
      - Vulnerability disclosure: security/vulnerability-disclosure.md
  - OpenAdapt.ai ↗: https://openadapt.ai
