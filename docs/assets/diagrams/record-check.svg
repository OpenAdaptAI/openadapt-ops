<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 490" width="1100" height="490" role="img" aria-labelledby="title desc">
  <title id="title">How OpenAdapt checks a save</title>
  <desc id="desc">On the acting surface, the app screen OpenAdapt types into, a run checks that the right record is on screen and then enters and saves. It then reads the record back. A UI read-back clears the stale screen and re-reads the persisted record via a fresh reload, reopened record view, or separate read-only session for UI-only apps. A system-of-record read uses the app's API, database, or file export when available. An un-reloaded acting screen toast alone never confirms a save. If the read matches, the run ends VERIFIED with a run report and a receipt, and OpenAdapt Cloud countersigns the receipt only after a system-of-record read. If it doesn't match or can't tell, the run ends RECONCILIATION_REQUIRED and a person checks the record before any retry. If the right-record check fails, the run ends HALTED_BEFORE_EFFECT before saving and asks a person.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" class="arrow-fill"/>
    </marker>
    <style>
      :root {
        --bg: #ffffff;
        --border: #dde3e9;
        --panel: #f5f7fa;
        --panel-raised: #ffffff;
        --ink: #0f1722;
        --muted: #4f5a67;
        --link-bg: #eef3fc;
        --link-bd: #1f4fbf;
        --ok-bg: #e8f3ee;
        --ok-bd: #0b7a5a;
        --ok-ink: #07553e;
        --warn-bg: #fcf3e6;
        --warn-bd: #9a5b0a;
        --warn-ink: #7a4706;
        --line: #4f5a67;
      }
      text { font-family: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--ink); font-size: 14px; }
      .bg { fill: var(--bg); stroke: var(--border); stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; }
      .head { font-size: 15px; font-weight: 700; }
      .sub { fill: var(--muted); }
      .note { fill: var(--muted); font-style: italic; }
      .small { font-size: 13px; fill: var(--muted); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: var(--muted); }
      .outcome { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; }
      .outcome-ok { fill: var(--ok-ink); }
      .outcome-warn { fill: var(--warn-ink); }
      .line { stroke: var(--line); stroke-width: 1.75; fill: none; }
      .arrow-fill { fill: var(--line); }
      .box-link { fill: var(--link-bg); stroke: var(--link-bd); stroke-width: 1.5; }
      .box-raised { fill: var(--panel-raised); stroke: var(--link-bd); stroke-width: 1.5; }
      .box-muted { fill: var(--panel); stroke: var(--border); stroke-width: 1.5; }
      .box-ok { fill: var(--ok-bg); stroke: var(--ok-bd); stroke-width: 1.8; }
      .box-ok-dash { fill: var(--panel-raised); stroke: var(--ok-bd); stroke-width: 1.5; stroke-dasharray: 6 4; }
      .box-warn { fill: var(--warn-bg); stroke: var(--warn-bd); stroke-width: 1.8; }
    </style>
  </defs>

  <rect x="1" y="1" width="1098" height="488" rx="14" class="bg"/>

  <!-- Acting surface -->
  <rect x="20" y="40" width="290" height="300" rx="12" class="box-link"/>
  <text x="40" y="70" class="title">Acting surface</text>
  <text x="40" y="96" class="sub">The app screen OpenAdapt types</text>
  <text x="40" y="116" class="sub">into: a web page, a desktop app,</text>
  <text x="40" y="136" class="sub">or an RDP or Citrix window</text>
  <rect x="32" y="180" width="134" height="90" rx="10" class="box-raised"/>
  <text x="44" y="216" class="head">1. Right-record</text>
  <text x="44" y="238" class="head">check</text>
  <rect x="186" y="180" width="112" height="90" rx="10" class="box-raised"/>
  <text x="198" y="216" class="head">2. Enter and</text>
  <text x="198" y="238" class="head">save</text>
  <path d="M166,225 L182,225" class="line" marker-end="url(#arrow)"/>

  <!-- Read-back -->
  <text x="350" y="50" class="title">3. Read the record back</text>
  <text x="350" y="72" class="sub">and compare it with the input</text>
  <rect x="350" y="90" width="300" height="105" rx="12" class="box-muted" stroke-dasharray="6 4"/>
  <text x="366" y="116" class="head">UI read-back</text>
  <text x="366" y="138" class="sub">Fresh reload, reopened record,</text>
  <text x="366" y="158" class="sub">or separate read-only session</text>
  <text x="366" y="181" class="mono">fresh_reload / ui_readback</text>
  <rect x="350" y="215" width="300" height="125" rx="12" class="box-ok"/>
  <text x="366" y="241" class="head">System-of-record read</text>
  <text x="366" y="263">The system of record: its API,</text>
  <text x="366" y="283">database, or file export when</text>
  <text x="366" y="303">available</text>
  <text x="366" y="326" class="mono">independent_readback</text>
  <text x="350" y="368" class="note">An un-reloaded acting screen toast alone never confirms a save.</text>
  <path d="M298,225 L322,225 L322,142 L346,142" class="line" marker-end="url(#arrow)"/>
  <path d="M322,225 L322,277 L346,277" class="line" marker-end="url(#arrow)"/>

  <!-- Merge -->
  <path d="M650,142 L690,142 M650,277 L690,277 M690,85 L690,300" class="line"/>
  <path d="M690,85 L756,85" class="line" marker-end="url(#arrow)"/>
  <path d="M690,300 L756,300" class="line" marker-end="url(#arrow)"/>
  <text x="698" y="76" class="small">matches</text>
  <text x="658" y="322" class="small">no match,</text>
  <text x="658" y="338" class="small">or can't tell</text>

  <!-- Outcomes -->
  <rect x="760" y="45" width="320" height="80" rx="12" class="box-ok"/>
  <text x="776" y="76" class="outcome outcome-ok">VERIFIED</text>
  <text x="776" y="102">Run report and signed receipt</text>
  <path d="M920,125 L920,156" class="line" marker-end="url(#arrow)"/>
  <rect x="760" y="160" width="320" height="72" rx="12" class="box-ok-dash"/>
  <text x="776" y="189" class="head">Countersigned by OpenAdapt Cloud</text>
  <text x="776" y="213" class="sub">Only after an independent read</text>
  <rect x="760" y="262" width="320" height="88" rx="12" class="box-warn"/>
  <text x="776" y="290" class="outcome outcome-warn">RECONCILIATION_REQUIRED</text>
  <text x="776" y="314">Stops and asks a person, who</text>
  <text x="776" y="334">checks the record before any retry</text>

  <!-- Stop before saving -->
  <path d="M99,270 L99,396" class="line" marker-end="url(#arrow)"/>
  <text x="108" y="372" class="small">wrong record or</text>
  <text x="108" y="388" class="small">unexpected screen</text>
  <rect x="20" y="400" width="630" height="70" rx="12" class="box-warn"/>
  <text x="36" y="428" class="outcome outcome-warn">HALTED_BEFORE_EFFECT</text>
  <text x="36" y="452">Stops before saving and asks a person. Nothing was written.</text>
</svg>
