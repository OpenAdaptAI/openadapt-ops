[project]
name = "openadapt-maintenance"
version = "0.1.0"
description = "Automated documentation generator for the OpenAdapt ecosystem"
requires-python = ">=3.10"
dependencies = [
    "mkdocs-material>=9.5",
    # Security floors for transitive documentation/runtime dependencies. Keep
    # these explicit so a future lock refresh cannot select an affected build.
    "pymdown-extensions>=11.0.1",
    "pygments>=2.20.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "requests>=2.33.0",
    "idna>=3.15",
    "urllib3>=2.7.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.12",
]

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
