name: Production backup dispatch absence authority

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions: {}

concurrency:
  group: production-backup-dispatch-authority
  cancel-in-progress: false

jobs:
  reject-lifecycle-app:
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Reject the lifecycle App
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          test "${ACTOR}" != 'openadapt-lifecycle[bot]'
          test "${TRIGGERING_ACTOR}" != 'openadapt-lifecycle[bot]'

  reconcile:
    needs: reject-lifecycle-app
    if: >-
      vars.OPENADAPT_BACKUP_DISPATCH_AUTHORITY_ENABLED == 'true' &&
      github.actor != 'openadapt-lifecycle[bot]' &&
      github.triggering_actor != 'openadapt-lifecycle[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-backup-control
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: '992382684924'
      AWS_BACKUP_CONTROL_BUCKET: ${{ vars.AWS_BACKUP_CONTROL_BUCKET }}
      AWS_BACKUP_CONTROL_ROLE_ARN: ${{ vars.AWS_BACKUP_CONTROL_ROLE_ARN }}
      AWS_REGION: us-east-1
      BACKUP_CONTROL_APP_ID: ${{ vars.OPENADAPT_BACKUP_CONTROL_APP_ID }}
      BACKUP_CONTROL_APP_SLUG: ${{ vars.OPENADAPT_BACKUP_CONTROL_APP_SLUG }}
      BACKUP_CONTROL_INSTALLATION_ID: ${{ vars.OPENADAPT_BACKUP_CONTROL_INSTALLATION_ID }}
      OPS_BACKUP_DISPATCH_RESOLUTION_TOKEN: ${{ secrets.OPS_BACKUP_DISPATCH_RESOLUTION_TOKEN }}
      EXPECTED_PUBLIC_KEY_SHA256: ${{ vars.OPENADAPT_BACKUP_DISPATCH_RESOLUTION_PUBLIC_KEY_SHA256 }}
      GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
      KMS_KEY_ARN: ${{ vars.OPENADAPT_BACKUP_DISPATCH_RESOLUTION_KMS_KEY_ARN }}
      REVOKED_RESOLUTION_KEY_IDS: ${{ vars.OPENADAPT_BACKUP_DISPATCH_RESOLUTION_REVOKED_KEY_IDS }}
    steps:
      - name: Refuse an incomplete authority
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = 'OpenAdaptAI/openadapt-ops'
          test "${GITHUB_REF}" = 'refs/heads/main'
          test "${GITHUB_REF_PROTECTED}" = 'true'
          test -n "${AWS_BACKUP_CONTROL_BUCKET}"
          test -n "${AWS_BACKUP_CONTROL_ROLE_ARN}"
          test -n "${BACKUP_CONTROL_APP_ID}"
          test -n "${BACKUP_CONTROL_APP_SLUG}"
          test -n "${BACKUP_CONTROL_INSTALLATION_ID}"
          test -n "${OPS_BACKUP_DISPATCH_RESOLUTION_TOKEN}"
          test "${EXPECTED_PUBLIC_KEY_SHA256}" != ''
          test -n "${KMS_KEY_ARN}"
          test "${REVOKED_RESOLUTION_KEY_IDS}" != ''

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the exact backup-control App installation token
        id: backup-control-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.BACKUP_CONTROL_APP_ID }}
          private-key: ${{ secrets.OPENADAPT_BACKUP_CONTROL_APP_PRIVATE_KEY }}
          owner: OpenAdaptAI
          repositories: openadapt-ops
          permission-actions: read
          permission-metadata: read

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_BACKUP_CONTROL_ROLE_ARN }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: openadapt-backup-absence-${{ github.run_id }}

      - name: Verify the exact active KMS signer and revocation state
        run: |
          set -euo pipefail
          aws kms describe-key --key-id "${KMS_KEY_ARN}" \
            > /tmp/dispatch-kms-key.json
          aws kms get-public-key --key-id "${KMS_KEY_ARN}" \
            > /tmp/dispatch-kms-public-key.json
          aws kms list-aliases --key-id "${KMS_KEY_ARN}" \
            > /tmp/dispatch-kms-aliases.json
          test "$(jq -r '.KeyMetadata.AWSAccountId' /tmp/dispatch-kms-key.json)" = "${AWS_ACCOUNT_ID}"
          test "$(jq -r '.KeyMetadata.Arn' /tmp/dispatch-kms-key.json)" = "${KMS_KEY_ARN}"
          test "$(jq -r '.KeyMetadata.KeySpec' /tmp/dispatch-kms-key.json)" = 'ECC_NIST_P256'
          test "$(jq -r '.KeyMetadata.KeyUsage' /tmp/dispatch-kms-key.json)" = 'SIGN_VERIFY'
          test "$(jq -r '.KeyMetadata.KeyState' /tmp/dispatch-kms-key.json)" = 'Enabled'
          test "$(jq -r '.KeyId' /tmp/dispatch-kms-public-key.json)" = "${KMS_KEY_ARN}"
          test "$(jq -c '.SigningAlgorithms' /tmp/dispatch-kms-public-key.json)" = '["ECDSA_SHA_256"]'
          test "$(jq '[.Aliases[] | select(.AliasName == "alias/openadapt-production-backup-dispatch-resolution")] | length' /tmp/dispatch-kms-aliases.json)" = '1'
          jq -e 'type == "array" and all(.[]; type == "string")' \
            <<< "${REVOKED_RESOLUTION_KEY_IDS}" > /dev/null
          test "$(jq --arg key 'ops-backup-dispatch-resolution-kms-p256-2026-01' 'index($key) == null' <<< "${REVOKED_RESOLUTION_KEY_IDS}")" = 'true'
          jq -r '.PublicKey' /tmp/dispatch-kms-public-key.json \
            | base64 --decode > /tmp/dispatch-kms-public-key.der
          actual_public_key_sha256=$(openssl dgst -sha256 /tmp/dispatch-kms-public-key.der | awk '{print $2}')
          test "${actual_public_key_sha256}" = "${EXPECTED_PUBLIC_KEY_SHA256}"

      - name: Fetch and validate the exact Cloud absence queue
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer ${OPS_BACKUP_DISPATCH_RESOLUTION_TOKEN}" \
            --header 'Accept: application/json' \
            --output /tmp/dispatch-reconciliation-queue.json \
            'https://cloud.openadapt.ai/api/internal/backup/dispatch-reconciliation/pending?limit=50'
          python scripts/database_backup_dispatch_reconciliation.py validate-queue \
            --queue /tmp/dispatch-reconciliation-queue.json \
            --output /tmp/dispatch-reconciliation-queue-validated.json

      - name: Prove absence, sign once, and retain the Cloud reissue
        env:
          BACKUP_CONTROL_GITHUB_TOKEN: ${{ steps.backup-control-app.outputs.token }}
        run: |
          set -euo pipefail
          umask 077

          put_exact_object() {
            local source=$1
            local key=$2
            local checksum
            checksum=$(openssl dgst -sha256 -binary "${source}" | base64)
            set +e
            aws s3api put-object \
              --bucket "${AWS_BACKUP_CONTROL_BUCKET}" \
              --key "${key}" \
              --body "${source}" \
              --if-none-match '*' \
              --server-side-encryption AES256 \
              --checksum-algorithm SHA256 \
              --checksum-sha256 "${checksum}" \
              --expected-bucket-owner "${AWS_ACCOUNT_ID}" > /dev/null
            local result=$?
            set -e
            if [ "${result}" -ne 0 ]; then
              aws s3api get-object \
                --bucket "${AWS_BACKUP_CONTROL_BUCKET}" \
                --key "${key}" \
                --expected-bucket-owner "${AWS_ACCOUNT_ID}" \
                /tmp/dispatch-existing.json > /dev/null
              cmp -s "${source}" /tmp/dispatch-existing.json
            fi
          }

          while IFS= read -r candidate; do
            printf '%s' "${candidate}" > /tmp/dispatch-candidate.json
            required_at=$(jq -r '.reconciliation_required_at' /tmp/dispatch-candidate.json)
            required_epoch=$(date -u -d "${required_at}" +%s)
            now_epoch=$(date -u +%s)
            if [ $((now_epoch - required_epoch)) -lt 300 ]; then
              continue
            fi
            attempt_digest=$(jq -r '.dispatch_attempt_id_sha256' /tmp/dispatch-candidate.json)
            ingress_key="dispatch-ingress/sha256/${attempt_digest:0:2}/${attempt_digest}.json"
            set +e
            aws s3api get-object \
              --bucket "${AWS_BACKUP_CONTROL_BUCKET}" \
              --key "${ingress_key}" \
              --expected-bucket-owner "${AWS_ACCOUNT_ID}" \
              /tmp/dispatch-ingress-found.json \
              > /dev/null 2> /tmp/dispatch-ingress-error.txt
            ingress_result=$?
            set -e
            if [ "${ingress_result}" -eq 0 ]; then
              continue
            fi
            grep -Eq '\((NoSuchKey|NotFound|404)\)' /tmp/dispatch-ingress-error.txt

            python scripts/database_backup_dispatch_reconciliation.py prepare-not-received \
              --candidate /tmp/dispatch-candidate.json \
              --expected-attempt-sha256 "${attempt_digest}" \
              --expected-envelope-sha256 "$(jq -r '.dispatch_envelope_sha256' /tmp/dispatch-candidate.json)" \
              --github-token-env BACKUP_CONTROL_GITHUB_TOKEN \
              --expected-app-id "${BACKUP_CONTROL_APP_ID}" \
              --expected-app-slug "${BACKUP_CONTROL_APP_SLUG}" \
              --expected-installation-id "${BACKUP_CONTROL_INSTALLATION_ID}" \
              --s3-bucket "${AWS_BACKUP_CONTROL_BUCKET}" \
              --s3-expected-owner "${AWS_ACCOUNT_ID}" \
              --output /tmp/dispatch-prepared.json

            resolution_id=$(jq -r '.resolution.resolution_id' /tmp/dispatch-prepared.json)
            resolution_sha256=$(jq -r '.resolution_sha256' /tmp/dispatch-prepared.json)
            evidence_key="dispatch-absence/${resolution_id}/${resolution_sha256}.signing-request.json"
            put_exact_object /tmp/dispatch-prepared.json "${evidence_key}"
            jq -r '.canonical_resolution_b64' /tmp/dispatch-prepared.json \
              | base64 --decode > /tmp/dispatch-resolution-message.json

            set +e
            aws s3api head-object \
              --bucket "${AWS_BACKUP_CONTROL_BUCKET}" \
              --key "${ingress_key}" \
              --expected-bucket-owner "${AWS_ACCOUNT_ID}" \
              > /tmp/dispatch-ingress-recheck.json \
              2> /tmp/dispatch-ingress-recheck-error.txt
            ingress_recheck_result=$?
            set -e
            if [ "${ingress_recheck_result}" -eq 0 ]; then
              continue
            fi
            grep -Fq 'An error occurred (404)' /tmp/dispatch-ingress-recheck-error.txt

            aws kms sign \
              --key-id "${KMS_KEY_ARN}" \
              --message fileb:///tmp/dispatch-resolution-message.json \
              --message-type RAW \
              --signing-algorithm ECDSA_SHA_256 \
              > /tmp/dispatch-kms-signature.json
            python scripts/database_backup_dispatch_reconciliation.py seal-kms-signature \
              --prepared /tmp/dispatch-prepared.json \
              --kms-response /tmp/dispatch-kms-signature.json \
              --expected-kms-key-arn "${KMS_KEY_ARN}" \
              --output /tmp/dispatch-resolution.json
            resolution_envelope_sha256=$(openssl dgst -sha256 /tmp/dispatch-resolution.json | awk '{print $2}')
            resolution_key="dispatch-resolutions/${resolution_id}/${resolution_envelope_sha256}.resolution.json"
            put_exact_object /tmp/dispatch-resolution.json "${resolution_key}"

            set +e
            reissue_status=$(curl --silent --show-error \
              --output /tmp/dispatch-reissue.json \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${OPS_BACKUP_DISPATCH_RESOLUTION_TOKEN}" \
              --header 'Content-Type: application/json' \
              --header "Idempotency-Key: ${resolution_id}" \
              --data-binary @/tmp/dispatch-resolution.json \
              'https://cloud.openadapt.ai/api/internal/backup/dispatch-reconciliation')
            curl_result=$?
            set -e
            test "${curl_result}" -eq 0
            python scripts/database_backup_dispatch_reconciliation.py verify-reissue-receipt \
              --resolution /tmp/dispatch-resolution.json \
              --response /tmp/dispatch-reissue.json \
              --http-status "${reissue_status}" \
              --output /tmp/dispatch-reissue-result.json

            set +e
            status_code=$(curl --silent --show-error \
              --output /tmp/dispatch-status.json \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${OPS_BACKUP_DISPATCH_RESOLUTION_TOKEN}" \
              --header 'Accept: application/json' \
              "https://cloud.openadapt.ai/api/internal/backup/dispatch-reconciliation/status?resolution_id=${resolution_id}")
            curl_result=$?
            set -e
            test "${curl_result}" -eq 0
            python scripts/database_backup_dispatch_reconciliation.py verify-resolution-status \
              --resolution /tmp/dispatch-resolution.json \
              --reissue-response /tmp/dispatch-reissue.json \
              --status-response /tmp/dispatch-status.json \
              --http-status "${status_code}" \
              --output /tmp/dispatch-status-result.json

            reissue_sha256=$(openssl dgst -sha256 /tmp/dispatch-reissue.json | awk '{print $2}')
            status_sha256=$(openssl dgst -sha256 /tmp/dispatch-status.json | awk '{print $2}')
            put_exact_object /tmp/dispatch-reissue.json \
              "dispatch-resolutions/${resolution_id}/${reissue_sha256}.reissue-receipt.json"
            put_exact_object /tmp/dispatch-status.json \
              "dispatch-resolutions/${resolution_id}/${status_sha256}.status.json"
          done < <(jq -c '.candidates[]' /tmp/dispatch-reconciliation-queue-validated.json)

      - name: Remove transient reconciliation material
        if: always()
        run: |
          rm -f /tmp/dispatch-*.json /tmp/dispatch-*.der /tmp/dispatch-*.txt
