name: Docs CI

on:
  pull_request:
  push:
    branches:
      - main
    # A docs-source push is independently validated by sync.yml immediately
    # before deployment. Avoid installing, testing, and building it twice.
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/sync.yml'

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate canonical docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run pytest tests/ -q

      # The customer and prospect name list is private. It reaches CI only as
      # the DOCS_PRIVATE_NAME_PATTERNS secret; see scripts/README.md. Without
      # it (a fork's pull request), the name check is skipped with a notice.
      - name: Validate product documentation contract
        env:
          DOCS_PRIVATE_NAME_PATTERNS: ${{ secrets.DOCS_PRIVATE_NAME_PATTERNS }}
        run: uv run python scripts/validate_docs.py

      # Offline half only: structure and the claim registry. The PyPI
      # comparison runs daily in published-version-claims.yml, because the
      # docs go stale when another repository releases, not when a PR lands.
      - name: Validate published version claims (offline)
        run: uv run python scripts/check_published_version_claims.py --offline

      - name: Build canonical documentation in strict mode
        run: uv run mkdocs build --strict

      - name: Check the built site for private names
        env:
          DOCS_PRIVATE_NAME_PATTERNS: ${{ secrets.DOCS_PRIVATE_NAME_PATTERNS }}
        run: uv run python scripts/check_private_names.py --site site

      # Every internal link and #anchor in the built site, offline. With no
      # network it can't flake, so it can gate a pull request. External links
      # change without a commit here; link-check.yml checks them weekly.
      - name: Check internal links and anchors in the built site
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --include-fragments --no-progress
            --root-dir ${{ github.workspace }}/site --index-files index.html
            'site/**/*.html'
          jobSummary: false

  flow-cli-release:
    name: Command reference matches the released Flow CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # Installs the pinned openadapt-flow release from PyPI in a throwaway
      # environment and compares its parser with the committed snapshot that
      # docs/reference/flow-commands.md is generated from. A PyPI release is
      # immutable, so this fails only when the snapshot or the pin changed.
      - name: Compare the snapshot with openadapt-flow on PyPI
        run: python3 scripts/flow_cli_reference.py check-pypi

  cli-reference:
    name: Command help matches the pinned releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # Installs exactly the releases in cli-reference/requirements.txt in a
      # throwaway environment, regenerates docs/reference/cli-help.md and the
      # agent CLI fixture from the launcher and agent parsers, and fails if the
      # committed copies differ. The fix is to rerun the script and commit.
      - name: Install the pinned releases
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/cli-ref"
          uv pip install --python "$RUNNER_TEMP/cli-ref/bin/python" -r cli-reference/requirements.txt

      - name: Regenerate the command help and fixture
        run: '"$RUNNER_TEMP/cli-ref/bin/python" scripts/generate_cli_reference.py'

      - name: Fail on drift
        run: git diff --exit-code -- docs/reference/cli-help.md tests/fixtures/agent_cli.json

  design-tokens:
    name: Vendored design tokens match openadapt-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The online half of the palette guard. The offline half runs in
      # `pytest tests/` above and needs no network: it pins the digest of each
      # vendored copy and fails on a retired palette value in any shipped
      # stylesheet, template, script, SVG, or recorded image measurement.
      #
      # This job is what catches the other direction: a token that changes in
      # the published openadapt-web palette while this site serves the old value.
      # Failing here is the intended outcome of that drift, not a flake. The
      # fix is `python scripts/vendor_design_tokens.py --write`, reviewed and
      # committed. Nothing is installed, so it cannot fail on a lock refresh.
      - name: Check the vendored tokens against the published palette
        run: python scripts/vendor_design_tokens.py --check
