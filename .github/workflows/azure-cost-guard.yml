name: Azure temporary VM cost guard

on:
  workflow_dispatch:
  schedule:
    - cron: '17 14 * * *'

permissions:
  contents: read

concurrency:
  group: azure-cost-guard
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - id: credentials
        name: Detect Azure credentials
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -n "$AZURE_CREDENTIALS" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ steps.credentials.outputs.available == 'true' }}
        uses: Azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - id: guard
        name: Report temporary VM cost
        if: ${{ steps.credentials.outputs.available == 'true' }}
        continue-on-error: true
        run: >-
          python scripts/azure_cost_guard.py
          --subscription 78add6c6-c92a-4a53-b751-eb644ac77e59
          --alert-daily-cad 5.00
          --github-output "$GITHUB_OUTPUT"

      - name: Fail when the guard detects unprotected daily cost
        if: ${{ steps.credentials.outputs.available == 'true' && (steps.guard.outcome == 'failure' || steps.guard.outputs.alert == 'true') }}
        run: exit 1
