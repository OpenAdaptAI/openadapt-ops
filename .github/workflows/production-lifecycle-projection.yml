name: Production lifecycle feed source

on:
  workflow_dispatch:
    inputs:
      expected_old_commit:
        description: Exact current feed commit; empty only for first creation
        required: false
        type: string
      new_commit:
        description: Exact .github main commit that contains the feed
        required: true
        type: string
      feed_sha256:
        description: Exact sha256 digest of production-lifecycle-feed.json
        required: true
        type: string
      checkpoint_sha256:
        description: Exact checkpoint object digest named by the feed
        required: true
        type: string
      registry_head_sha256:
        description: Exact content-addressed registry head digest
        required: true
        type: string
      expires_at:
        description: Exact feed expiry
        required: true
        type: string
      idempotency_key:
        description: Domain-bound lifecycle-feed-update idempotency key
        required: true
        type: string

permissions: {}

concurrency:
  group: production-lifecycle-feed-source
  cancel-in-progress: false

jobs:
  authorize-lifecycle-app:
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Refuse any identity or source other than the exact lifecycle App on main
        env:
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          EXPECTED_ACTOR_ID: ${{ vars.OPENADAPT_LIFECYCLE_ACTOR_ID }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = 'OpenAdaptAI/openadapt-ops'
          test "$REF" = 'refs/heads/main'
          test "$EVENT_NAME" = 'workflow_dispatch'
          test "$ACTOR" = 'openadapt-lifecycle[bot]'
          test "$TRIGGERING_ACTOR" = 'openadapt-lifecycle[bot]'
          test -n "$EXPECTED_ACTOR_ID"
          test "$ACTOR_ID" = "$EXPECTED_ACTOR_ID"

  dispatch-feed-update:
    name: Dispatch one exact Production lifecycle feed update
    needs: authorize-lifecycle-app
    if: >-
      github.repository == 'OpenAdaptAI/openadapt-ops' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'openadapt-lifecycle[bot]' &&
      github.triggering_actor == 'openadapt-lifecycle[bot]' &&
      github.actor_id == vars.OPENADAPT_LIFECYCLE_ACTOR_ID
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-lifecycle-projection
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify exact current protected Ops main and .github candidate ancestry
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_COMMIT: ${{ inputs.new_commit }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/main'
          test "${GITHUB_REF_PROTECTED}" = 'true'
          test "${GITHUB_SHA}" = "$(gh api repos/OpenAdaptAI/openadapt-ops/commits/main --jq .sha)"
          test "${NEW_COMMIT}" = "$(gh api repos/OpenAdaptAI/.github/commits/main --jq .sha)"

      - name: Build the closed canonical feed update
        env:
          CHECKPOINT_SHA256: ${{ inputs.checkpoint_sha256 }}
          EXPECTED_OLD_COMMIT: ${{ inputs.expected_old_commit }}
          EXPIRES_AT: ${{ inputs.expires_at }}
          FEED_SHA256: ${{ inputs.feed_sha256 }}
          IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
          NEW_COMMIT: ${{ inputs.new_commit }}
          REGISTRY_HEAD_SHA256: ${{ inputs.registry_head_sha256 }}
        run: |
          set -euo pipefail
          python scripts/prepare_production_lifecycle_projection.py \
            --source-commit "$GITHUB_SHA" \
            --expected-old-commit "$EXPECTED_OLD_COMMIT" \
            --new-commit "$NEW_COMMIT" \
            --feed-sha256 "$FEED_SHA256" \
            --checkpoint-sha256 "$CHECKPOINT_SHA256" \
            --registry-head-sha256 "$REGISTRY_HEAD_SHA256" \
            --expires-at "$EXPIRES_AT" \
            --idempotency-key "$IDEMPOTENCY_KEY" \
            --output /tmp/production-lifecycle-feed-update.json

      - name: Create the exact lifecycle App installation token
        id: lifecycle-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.OPENADAPT_LIFECYCLE_APP_ID }}
          private-key: ${{ secrets.OPENADAPT_LIFECYCLE_APP_PRIVATE_KEY }}
          owner: OpenAdaptAI
          repositories: |
            .github
            openadapt-evals
            openadapt-ops
          permission-actions: write
          permission-contents: write
          permission-metadata: read
          permission-pull-requests: write

      - name: Verify the exact lifecycle App installation
        env:
          EXPECTED_APP_ID: ${{ vars.OPENADAPT_LIFECYCLE_APP_ID }}
          EXPECTED_INSTALLATION_ID: ${{ vars.OPENADAPT_LIFECYCLE_INSTALLATION_ID }}
          GH_TOKEN: ${{ steps.lifecycle-app.outputs.token }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_APP_ID"
          test -n "$EXPECTED_INSTALLATION_ID"
          test "$(gh api /installation --jq '.app_id | tostring')" = "$EXPECTED_APP_ID"
          test "$(gh api /installation --jq '.id | tostring')" = "$EXPECTED_INSTALLATION_ID"

      - name: Dispatch the protected feed ref producer once
        env:
          GH_TOKEN: ${{ steps.lifecycle-app.outputs.token }}
        run: |
          set -euo pipefail
          feed_update_json=$(</tmp/production-lifecycle-feed-update.json)
          gh workflow run production-lifecycle-ref.yml \
            --repo OpenAdaptAI/.github \
            --ref main \
            -f feed_update_json="$feed_update_json"
