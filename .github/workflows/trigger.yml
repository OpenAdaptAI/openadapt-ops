# Template: copy this to each sub-repo as .github/workflows/notify-docs.yml
# Requires DOCS_DISPATCH_TOKEN secret (fine-grained PAT with repo scope on openadapt-ops)
#
# This template lives in EACH content sub-repo so that a change to that repo's
# README/changelog rebuilds docs.openadapt.ai (cross-repo content sync). The
# docs repo (openadapt-ops) publishes its OWN docs changes directly via the
# push trigger in sync.yml and does not need this template.

name: Notify docs
on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # Dispatch a repository_dispatch event to openadapt-ops so it
      # rebuilds and deploys docs.openadapt.ai. We POST directly to the GitHub
      # API with curl (no third-party action) and retry on transient failures
      # such as the intermittent "Request body length does not match
      # content-length header" error that previously silently dropped the
      # dispatch. curl --fail makes any non-2xx HTTP status a retryable error;
      # a non-zero exit after all retries fails the job (loud, red).
      - name: Dispatch repo-updated to openadapt-ops
        env:
          DOCS_DISPATCH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          curl --fail --show-error --silent \
            --retry 5 --retry-all-errors --retry-delay 5 \
            -X POST \
            -H "Authorization: Bearer ${DOCS_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/OpenAdaptAI/openadapt-ops/dispatches \
            -d "{\"event_type\":\"repo-updated\",\"client_payload\":{\"repo\":\"${REPO}\",\"sha\":\"${SHA}\"}}"

      - name: Report dispatch failure
        if: failure()
        run: |
          echo "::error::docs dispatch failed - docs did NOT deploy. The repository_dispatch to OpenAdaptAI/openadapt-ops (event-type repo-updated) did not fire after retries; docs.openadapt.ai will not rebuild for this push."
          exit 1
