name: Production DB logical backup

# Daily, off-provider logical recovery point. The database URL is a protected
# production-backup environment secret. Only age ciphertext and a redacted
# integrity manifest enter the private, public-access-blocked S3 bucket.
# Maximum RPO: 24 hours. Retention: 90 days. This does not cover Storage
# objects and does not replace provider PITR. The launch path uses one
# S3 PutObject with a service-validated full-object SHA-256 and refuses an
# encrypted archive above the 5 GiB PutObject limit before upload.

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'

permissions:
  contents: read

concurrency:
  group: production-db-backup
  cancel-in-progress: false

jobs:
  dump:
    # The complete production database is plaintext until the local age step.
    # Route this job only to the workflow-restricted production backup group.
    # GitHub-hosted runners and the default self-hosted group are not permitted.
    runs-on:
      group: production-backup
      labels: self-hosted
    timeout-minutes: 30
    environment: production-backup
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      BACKUP_ROLE_ARN: ${{ vars.AWS_BACKUP_ROLE_ARN }}
      BACKUP_BUCKET: ${{ vars.AWS_BACKUP_BUCKET }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      EXPECTED_GITHUB_ENVIRONMENT: production-backup
      GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
    steps:
      - name: Validate the protected environment configuration
        env:
          RUNNER_BOUNDARY: ${{ runner.environment }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${BACKUP_ROLE_ARN}" ] || missing+=(AWS_BACKUP_ROLE_ARN)
          [ -n "${BACKUP_BUCKET}" ] || missing+=(AWS_BACKUP_BUCKET)
          [ -n "${SUPABASE_DB_URL}" ] || missing+=(SUPABASE_DB_URL)
          [ -n "${SUPABASE_PROJECT_REF}" ] || missing+=(SUPABASE_PROJECT_REF)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::The production-backup environment is missing: ${missing[*]}"
            exit 1
          fi
          if [ "${GITHUB_REF}" != 'refs/heads/main' ]; then
            echo "::error::The database backup must run from refs/heads/main, not ${GITHUB_REF}."
            exit 1
          fi
          if [ "${GITHUB_REF_PROTECTED}" != 'true' ]; then
            echo '::error::The database backup refuses an unprotected main branch.'
            exit 1
          fi
          if [ "${RUNNER_BOUNDARY}" != 'self-hosted' ]; then
            echo '::error::The database backup requires its isolated self-hosted production boundary.'
            exit 1
          fi
          echo 'The four required production-backup settings are present.'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the exact GitHub environment gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/environments/${EXPECTED_GITHUB_ENVIRONMENT}" \
            > /tmp/database-backup-environment.json
          gh api "repos/${GITHUB_REPOSITORY}/environments/${EXPECTED_GITHUB_ENVIRONMENT}/deployment-branch-policies?per_page=100" \
            > /tmp/database-backup-environment-policies.json
          python scripts/check_github_environment_gate.py \
            --environment-json /tmp/database-backup-environment.json \
            --policies-json /tmp/database-backup-environment-policies.json \
            --expected-environment "${EXPECTED_GITHUB_ENVIRONMENT}" \
            --expected-branch main \
            --actual-ref "${GITHUB_REF}" \
            --ref-protected "${GITHUB_REF_PROTECTED}"

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.BACKUP_ROLE_ARN }}
          allowed-account-ids: '992382684924'
          role-session-name: openadapt-db-backup-${{ github.run_id }}

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.75.0

      - name: Install age
        # The dump, encrypt, and upload step is the recovery point and needs the
        # job budget. Without a step bound, one hung apt call consumes all 30
        # minutes and no backup is taken. `age` is a single small package, so 5
        # minutes is a wide margin over its normal install and it leaves 25 of
        # the 30 job minutes for the backup itself.
        timeout-minutes: 5
        run: |
          set -uo pipefail
          # The hosted runner resolves its Ubuntu mirror through
          # /etc/apt/apt-mirrors.txt, which points at azure.archive.ubuntu.com.
          # That mirror fails intermittently, and each failure costs minutes of
          # apt retries. Prefer the canonical archive. Best-effort: an absent or
          # already-canonical file changes nothing.
          #
          # The canonical archive is the source azure.archive.ubuntu.com mirrors,
          # so the same suite resolves the same `age` package. The package name
          # and its flags below are unchanged, so the encryption tool this backup
          # depends on is the same build it has always been.
          sudo sed -i \
            's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
          update_ok=""
          for attempt in 1 2 3; do
            if sudo apt-get update -qq; then
              update_ok=1
              break
            fi
            echo "::warning::apt-get update failed (attempt ${attempt}/3); retrying"
            sleep $((attempt * 10))
          done
          if [ -z "$update_ok" ]; then
            echo "::error::apt-get update failed three times; the Ubuntu mirror is unreachable"
            exit 1
          fi
          set -e
          sudo apt-get install -y -qq age

      - name: Validate the exact source, private target, and recipient
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo '::error::The production-backup environment needs SUPABASE_DB_URL and SUPABASE_PROJECT_REF.'
            exit 1
          fi
          if [ -z "$BACKUP_BUCKET" ]; then
            echo '::error::The production-backup environment needs AWS_BACKUP_BUCKET.'
            exit 1
          fi
          scripts/check_live_database_backup_target.sh "$BACKUP_BUCKET"
          python scripts/database_backup_contract.py validate-source \
            --db-url "$SUPABASE_DB_URL" \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --recipients ops/backup/age-recipients.txt

      - name: Dump, validate, encrypt, and upload
        run: |
          set -euo pipefail
          umask 077
          mkdir -p dump
          plain=''
          cipher=''
          cleanup() {
            find dump -type f -delete 2>/dev/null || true
            if [ -n "$plain" ]; then rm -f "$plain"; fi
            if [ -n "$cipher" ]; then rm -f "$cipher"; fi
            rm -f artifact-manifest.json
            rm -f s3-upload-contract.json /tmp/database-backup-object-attributes.json
            rm -f /tmp/database-backup-put-response.json
          }
          trap cleanup EXIT

          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          plain="db-backup-${stamp}.tar.gz"
          cipher="${plain}.age"
          prefix="daily/${stamp}"

          # This is the maintained Supabase roles/schema/data procedure. One
          # unflagged dump would be schema-only and is not a recovery point.
          supabase db dump --db-url "$SUPABASE_DB_URL" -f dump/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f dump/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f dump/data.sql \
            --use-copy --data-only \
            -x 'storage.buckets_vectors' -x 'storage.vector_indexes'

          python scripts/database_backup_contract.py create-contract \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --recipients ops/backup/age-recipients.txt \
            --dump-dir dump \
            --created-at "$created_at" \
            --supabase-cli-version "$(supabase --version)" \
            --maximum-rpo-seconds 86400 \
            --retention-days 90 \
            --output dump/backup-contract.json

          tar -czf "$plain" -C dump \
            roles.sql schema.sql data.sql backup-contract.json
          age -R ops/backup/age-recipients.txt -o "$cipher" "$plain"

          python scripts/database_backup_contract.py create-manifest \
            --contract dump/backup-contract.json \
            --plaintext-archive "$plain" \
            --ciphertext-archive "$cipher" \
            --repository-commit "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --output artifact-manifest.json
          python scripts/database_backup_contract.py verify-artifact \
            --manifest artifact-manifest.json \
            --ciphertext-archive "$cipher"

          python scripts/database_backup_contract.py prepare-single-put \
            --manifest artifact-manifest.json \
            --ciphertext-archive "$cipher" \
            --output s3-upload-contract.json
          cipher_bytes=$(jq -r '.bytes' s3-upload-contract.json)
          local_sha=$(jq -r '.sha256' s3-upload-contract.json)
          local_checksum=$(jq -r '.checksum_sha256' s3-upload-contract.json)
          aws s3api put-object \
            --bucket "$BACKUP_BUCKET" --key "${prefix}/${cipher}" \
            --body "$cipher" --content-length "$cipher_bytes" \
            --server-side-encryption AES256 --metadata "sha256=${local_sha}" \
            --checksum-algorithm SHA256 --checksum-sha256 "$local_checksum" \
            --expected-bucket-owner 992382684924 \
            > /tmp/database-backup-put-response.json
          aws s3 cp artifact-manifest.json \
            "s3://${BACKUP_BUCKET}/${prefix}/artifact-manifest.json" \
            --only-show-errors --sse AES256 \
            --content-type application/json --checksum-algorithm SHA256 \
            --expected-bucket-owner 992382684924

          aws s3api get-object-attributes \
            --bucket "$BACKUP_BUCKET" --key "${prefix}/${cipher}" \
            --object-attributes Checksum,ObjectSize \
            --expected-bucket-owner 992382684924 \
            > /tmp/database-backup-object-attributes.json
          python scripts/database_backup_contract.py verify-single-put \
            --upload-contract s3-upload-contract.json \
            --attributes /tmp/database-backup-object-attributes.json
          echo "Encrypted database backup stored at s3://${BACKUP_BUCKET}/${prefix}/"

  record-alert:
    name: Keep one durable backup alert
    needs: dump
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: Production database backup is not current
    steps:
      - name: Open, reopen, update, or close the backup issue
        env:
          BACKUP_RESULT: ${{ needs.dump.result }}
        run: |
          set -euo pipefail
          existing_json=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state all \
            --limit 1000 --json number,title,state \
            --jq '[.[] | select(.title == env.TITLE)][0] // {}')
          existing=$(jq -r '.number // empty' <<< "${existing_json}")
          existing_state=$(jq -r '.state // empty' <<< "${existing_json}")
          if [ "${BACKUP_RESULT}" = 'success' ]; then
            if [ -n "${existing}" ] && [ "${existing_state}" = 'OPEN' ]; then
              gh issue close "${existing}" --repo "${GITHUB_REPOSITORY}" \
                --comment "The encrypted database backup passed in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. The independent freshness check remains authoritative for the current recovery point."
            else
              echo 'The backup passed and no workflow-failure issue is open.'
            fi
            exit 0
          fi

          runner_note=''
          step_count='-1'
          if value=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
            --jq '[.jobs[] | select(.name == "dump") | (.steps | length)][0] // -1' \
            2>/dev/null); then
            step_count="$value"
          fi
          if [ "$step_count" = '0' ]; then
            runner_note='The dump job did not get a runner. Confirm that the organization has the workflow-restricted production-backup runner group and an online runner in that group.'
          fi
          printf '%s\n' \
            'The scheduled production database backup did not complete.' \
            '' \
            "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '' \
            "$runner_note" \
            '' \
            'No new recovery point is claimed. Review the failed step before any retry.' \
            > database-backup-alert.md
          if [ -n "${existing}" ]; then
            if [ "${existing_state}" = 'CLOSED' ]; then
              gh issue reopen "${existing}" --repo "${GITHUB_REPOSITORY}"
            fi
            gh issue edit "${existing}" --repo "${GITHUB_REPOSITORY}" \
              --body-file database-backup-alert.md
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" \
              --title "${TITLE}" --body-file database-backup-alert.md
          fi
