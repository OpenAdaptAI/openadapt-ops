name: Sync Documentation

on:
  # A merged docs change publishes the exact source on main.
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/sync.yml'
  # Cross-repo and operator triggers only prepare a reviewed source change.
  repository_dispatch:
    types: [repo-updated]
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 9 AM UTC
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repo to update (or "all" for full rebuild)'
        default: 'all'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name == 'push' && 'deploy' || 'prepare' }}
  cancel-in-progress: true

jobs:
  prepare-sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A manual run can select another ref. Generated content must still start
      # from current main before it enters the normal pull-request path.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra llm --extra dev

      - name: Check the public source boundary
        run: uv run python scripts/check_source_boundary.py

      - name: Sync READMEs
        run: uv run python scripts/sync_readmes.py

      - name: Aggregate changelogs
        run: uv run python scripts/aggregate_changelog.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate What's New
        run: uv run python scripts/generate_whats_new.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests against generated source
        run: uv run pytest tests/ -q

      - name: Validate
        run: uv run python scripts/validate_docs.py

      - name: Build MkDocs site
        run: uv run mkdocs build --strict

      - name: Check the generated site boundary
        run: uv run python scripts/check_source_boundary.py --site site

      - name: Record the generated docs source and open a PR for it
        id: docs_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: docs/auto-sync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          # The What's New digest stamps its generation minute. Ignore a diff
          # that changes only that clock so routine syncs do not create noise.
          if git diff --staged --quiet -I'^> \*Last updated: '; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Generated documentation carries no new content."
            exit 0
          fi
          git commit -m "docs: auto-sync generated documentation"

          # This workflow is the only writer for the generated branch. Replace
          # an older candidate with a new candidate based on current main.
          git push --force origin "HEAD:refs/heads/${BRANCH}"

          cat > /tmp/docs-auto-sync-body.md <<'BODY'
          Automated. Only the `Sync Documentation` workflow writes this branch.

          This pull request carries regenerated documentation from current
          `main`. The preparation run already ran the test suite,
          `scripts/validate_docs.py`, and a strict MkDocs build against this
          source.

          The site will publish only after this change merges to `main` and the
          resulting push passes the same validation and build gates.
          BODY

          echo "changed=true" >> "$GITHUB_OUTPUT"

          PR_URL=$(gh pr list --head "${BRANCH}" --base main --state open \
            --json url --jq '.[0].url // empty')
          if [ -z "${PR_URL}" ]; then
            gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "docs: auto-sync generated documentation" \
              --body-file /tmp/docs-auto-sync-body.md \
              || true
            PR_URL=$(gh pr list --head "${BRANCH}" --base main --state open \
              --json url --jq '.[0].url // empty')
          fi

          if [ -z "${PR_URL}" ]; then
            echo "::error::${BRANCH} holds generated source, but no pull request carries it to main."
            echo "Enable Settings > Actions > General > Allow GitHub Actions to create and approve pull requests."
            exit 1
          fi

          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
          echo "Docs auto-sync PR: ${PR_URL}"

          # A repository without auto-merge still gets a reviewable pull
          # request. A person can merge it after the required checks pass.
          if ! gh pr merge --squash --auto "${PR_URL}"; then
            echo "::warning::Auto-merge is not enabled on ${PR_URL}; merge it by hand."
          fi

  deploy-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra llm --extra dev

      - name: Check the public source boundary
        run: uv run python scripts/check_source_boundary.py

      - name: Run tests
        run: uv run pytest tests/ -q

      - name: Validate
        run: uv run python scripts/validate_docs.py

      - name: Build MkDocs site
        run: uv run mkdocs build --strict

      - name: Check the generated site boundary
        run: uv run python scripts/check_source_boundary.py --site site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
