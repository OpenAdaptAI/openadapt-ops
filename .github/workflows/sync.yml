name: Sync Documentation

on:
  repository_dispatch:
    types: [repo-updated]
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 9 AM UTC
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repo to update (or "all" for full rebuild)'
        default: 'all'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra llm --extra dev

      - name: Sync READMEs
        run: uv run python scripts/sync_readmes.py

      - name: Aggregate changelogs
        run: uv run python scripts/aggregate_changelog.py

      - name: Generate What's New
        run: uv run python scripts/generate_whats_new.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The auto-generated architecture overview mirrored each repo README and
      # deep-linked to per-package pages that the docs site no longer publishes.
      # The curated Concepts and Ecosystem sections replace it. Re-enable only
      # if a maintained, product-accurate architecture page is reintroduced.

      - name: Run tests against generated source
        run: uv run pytest tests/ -q

      - name: Validate
        run: uv run python scripts/validate_docs.py

      - name: Build MkDocs site
        run: uv run mkdocs build --strict

      # Persist exactly the generated source that passed the gates before
      # publishing it. A protected-branch rejection therefore blocks deploy.
      - name: Commit updated docs source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "docs: auto-sync documentation [skip ci]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
