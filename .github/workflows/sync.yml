name: Sync Documentation

on:
  # Same-repo docs merges publish directly, with no dispatch round-trip.
  # A push that only touches this repo's docs sources builds and deploys the
  # site as-is; the cross-repo content-sync steps below are skipped on push.
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/sync.yml'
  # Cross-repo content sync: sub-repos dispatch repo-updated (see trigger.yml)
  # when their README/changelog changes so their pages re-sync here.
  repository_dispatch:
    types: [repo-updated]
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 9 AM UTC
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repo to update (or "all" for full rebuild)'
        default: 'all'

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # GitHub starts no workflow for an event raised with this workflow's own
      # GITHUB_TOKEN. The auto-sync pull request's required checks then sit in
      # action_required, never report, and auto-merge never fires: the pull
      # request opened on 2026-09-21 waited weeks that way. A GitHub App
      # installation token raises ordinary events, so the checks run. Checkout
      # persists it for the branch push, and the PR step uses it for `gh`. A
      # same-repo push opens no pull request and keeps the default token.
      - name: Mint the docs sync app token
        id: app_token
        if: ${{ github.event_name != 'push' && vars.DOCS_SYNC_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOCS_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app_token.outputs.token || github.token }}

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra llm --extra dev

      # Cross-repo content sync (pulls from OTHER repos): runs on
      # repository_dispatch / schedule / workflow_dispatch, but is skipped on a
      # same-repo push, which just builds and deploys this repo's docs as-is.
      - name: Sync READMEs
        if: ${{ success() && github.event_name != 'push' }}
        run: uv run python scripts/sync_readmes.py

      - name: Aggregate changelogs
        if: ${{ success() && github.event_name != 'push' }}
        run: uv run python scripts/aggregate_changelog.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate What's New
        if: ${{ success() && github.event_name != 'push' }}
        run: uv run python scripts/generate_whats_new.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Refuses to replace the digest when a PR title matches the
          # private customer and prospect name list.
          DOCS_PRIVATE_NAME_PATTERNS: ${{ secrets.DOCS_PRIVATE_NAME_PATTERNS }}

      # The auto-generated architecture overview mirrored each repo README and
      # deep-linked to per-package pages that the docs site no longer publishes.
      # The curated Concepts and Ecosystem sections replace it. Re-enable only
      # if a maintained, product-accurate architecture page is reintroduced.

      - name: Run tests against generated source
        run: uv run pytest tests/ -q

      - name: Validate
        env:
          DOCS_PRIVATE_NAME_PATTERNS: ${{ secrets.DOCS_PRIVATE_NAME_PATTERNS }}
        run: uv run python scripts/validate_docs.py

      - name: Verify retained lifecycle results before publication
        run: uv run python scripts/generate_production_lifecycle_verification.py --check

      # mkdocs.yml reads the PostHog settings at build time, and the theme
      # override emits PostHog only when the key is set. The project key ships
      # to every browser, so it is an Actions variable, not a secret. Pull
      # request builds in ci.yml never set it and stay analytics-free.
      - name: Build MkDocs site
        env:
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}
        run: |
          uv run mkdocs build --strict
          if [ -z "${NEXT_PUBLIC_POSTHOG_KEY}" ]; then
            echo "::notice::NEXT_PUBLIC_POSTHOG_KEY is not set, so the published docs load no PostHog."
          elif ! grep -q "posthog.init" site/index.html; then
            echo "::error::NEXT_PUBLIC_POSTHOG_KEY is set, but the built site has no PostHog init."
            exit 1
          fi

      - name: Check the built site for private names
        env:
          DOCS_PRIVATE_NAME_PATTERNS: ${{ secrets.DOCS_PRIVATE_NAME_PATTERNS }}
        run: uv run python scripts/check_private_names.py --site site

      # Persist exactly the generated source that passed the gates before
      # publishing it. This workflow never pushes to `main`: the generated
      # commit goes to the workflow-owned branch `docs/auto-sync`, and an
      # auto-merging pull request carries it to `main`. Publishing therefore
      # works whether or not `main` requires a pull request. The branch push is
      # the persistence step and it gates deploy: published content is always
      # content that is recorded on that branch.
      #
      # Skipped on push: no cross-repo sync ran, so there is nothing new to
      # persist and no second commit to record.
      - name: Record the generated docs source and open a PR for it
        id: docs_pr
        if: ${{ success() && github.event_name != 'push' }}
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          BRANCH: docs/auto-sync
          STUCK_AFTER_DAYS: 8
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          # The What's New digest stamps the minute it was generated, and every
          # sub-repo push dispatches this workflow. Treating that clock as a
          # change would open a pull request many times a day that carries no
          # new documentation, so ignore it and keep the empty-diff no-op.
          if git diff --staged --quiet -I'^> \*Last updated: '; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Generated documentation carries no new content."
            exit 0
          fi
          git commit -m "docs: auto-sync generated documentation"

          # Read the open pull request before this push replaces its head. If
          # it is old and the head the previous run pushed never got a single
          # check, its required checks are not running and auto-merge cannot
          # fire. Fail the run after the deploy instead of reusing it quietly.
          PR_URL=""
          if [ -n "${GH_TOKEN}" ]; then
            PR_JSON=$(gh pr list --head "${BRANCH}" --base main --state open \
              --json url,createdAt,statusCheckRollup --jq '.[0] // {}')
            PR_URL=$(jq -r '.url // empty' <<< "${PR_JSON}")
            if [ -n "${PR_URL}" ]; then
              CREATED=$(jq -r '.createdAt' <<< "${PR_JSON}")
              CHECKS=$(jq '.statusCheckRollup | length' <<< "${PR_JSON}")
              AGE_DAYS=$(( ( $(date +%s) - $(date -d "${CREATED}" +%s) ) / 86400 ))
              if [ "${AGE_DAYS}" -ge "${STUCK_AFTER_DAYS}" ] && [ "${CHECKS}" -eq 0 ]; then
                echo "stuck=true" >> "$GITHUB_OUTPUT"
                echo "::error::${PR_URL} has been open ${AGE_DAYS} days and no check has reported on its head, so auto-merge cannot fire."
              fi
            fi
          fi

          # The concurrency group serialises this workflow, and nothing else
          # writes this branch, so overwriting it rebases the pending sync onto
          # current main instead of stacking stale generated commits.
          git push --force origin "HEAD:refs/heads/${BRANCH}"

          cat > /tmp/docs-auto-sync-body.md <<'BODY'
          Automated. Only the `Sync Documentation` workflow writes this branch.

          It carries the regenerated `docs/` source: the synced READMEs, the
          aggregated changelog, and the What's New page. The run that opened it
          already ran the test suite, `scripts/validate_docs.py`, and a strict
          MkDocs build against exactly this content.

          The docs sync GitHub App opens and pushes it, so the required checks
          run. Auto-merge (squash) is requested, so it lands once they pass.

          Nothing here is hand-edited. To change it, change the generator under
          `scripts/`.
          BODY

          echo "changed=true" >> "$GITHUB_OUTPUT"

          # Without the app token, a pull request would raise events that start
          # no checks. Keep the recorded branch and the deploy, and fail the run
          # after the deploy.
          if [ -z "${GH_TOKEN}" ]; then
            echo "app_missing=true" >> "$GITHUB_OUTPUT"
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            echo "::error::DOCS_SYNC_APP_CLIENT_ID is not set, so no pull request with running checks can carry ${BRANCH} to main."
            exit 0
          fi

          if [ -z "${PR_URL}" ]; then
            gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "docs: auto-sync generated documentation" \
              --body-file /tmp/docs-auto-sync-body.md \
              || echo "::warning::gh pr create failed for ${BRANCH}."
            PR_URL=$(gh pr list --head "${BRANCH}" --base main --state open \
              --json url --jq '.[0].url // empty')
          fi
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"

          # The generated source is already on the branch, so the deploy below
          # still publishes content that is recorded. Report the missing pull
          # request as a warning here and fail the run after the deploy, so a
          # broken queue is loud without also taking the site offline.
          if [ -z "${PR_URL}" ]; then
            echo "::warning::${BRANCH} holds the generated source, but no pull request carries it to main."
            exit 0
          fi
          echo "Docs auto-sync PR: ${PR_URL}"

          # A repository without auto-merge, or a token that may not enable it,
          # must not fail the sync: the PR still exists for a person to merge.
          if ! gh pr merge --squash --auto "${PR_URL}"; then
            echo "::warning::Auto-merge is not enabled on ${PR_URL}; merge it by hand."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # New content that reaches the site but never reaches `main` leaves the
      # published site ahead of its own source, and the next same-repo docs
      # push would rebuild without it. Fail the run so the gap is visible.
      - name: Confirm the auto-sync pull request can merge
        if: ${{ steps.docs_pr.outputs.app_missing == 'true' || steps.docs_pr.outputs.stuck == 'true' }}
        env:
          BRANCH: docs/auto-sync
        run: |
          echo "::error::The generated docs source on ${BRANCH} cannot reach main on its own."
          echo "GitHub starts no checks for a pull request raised with the workflow's GITHUB_TOKEN."
          echo "Install the docs sync GitHub App on this repository with Contents and Pull requests write access."
          echo "Set the DOCS_SYNC_APP_CLIENT_ID variable and the DOCS_SYNC_APP_PRIVATE_KEY secret."
          echo "Then approve the pending checks on the open auto-sync pull request, or close and reopen it once."
          exit 1

      - name: Confirm the generated source is queued for main
        if: ${{ steps.docs_pr.outputs.changed == 'true' && steps.docs_pr.outputs.app_missing != 'true' && steps.docs_pr.outputs.pr_url == '' }}
        env:
          BRANCH: docs/auto-sync
        run: |
          echo "::error::The generated docs source sits on ${BRANCH} with no pull request to main."
          echo "Check that the docs sync GitHub App is installed on this repository with Pull requests write access."
          exit 1
