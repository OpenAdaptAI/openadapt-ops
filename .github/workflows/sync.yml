name: Sync Documentation

on:
  # Same-repo docs merges publish directly, with no dispatch round-trip.
  # A push that only touches this repo's docs sources builds and deploys the
  # site as-is; the cross-repo content-sync steps below are skipped on push.
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/sync.yml'
  # Cross-repo content sync: sub-repos dispatch repo-updated (see trigger.yml)
  # when their README/changelog changes so their pages re-sync here.
  repository_dispatch:
    types: [repo-updated]
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 9 AM UTC
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repo to update (or "all" for full rebuild)'
        default: 'all'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra llm --extra dev

      # Cross-repo content sync (pulls from OTHER repos): runs on
      # repository_dispatch / schedule / workflow_dispatch, but is skipped on a
      # same-repo push, which just builds and deploys this repo's docs as-is.
      - name: Sync READMEs
        if: ${{ success() && github.event_name != 'push' }}
        run: uv run python scripts/sync_readmes.py

      - name: Aggregate changelogs
        if: ${{ success() && github.event_name != 'push' }}
        run: uv run python scripts/aggregate_changelog.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate What's New
        if: ${{ success() && github.event_name != 'push' }}
        run: uv run python scripts/generate_whats_new.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The auto-generated architecture overview mirrored each repo README and
      # deep-linked to per-package pages that the docs site no longer publishes.
      # The curated Concepts and Ecosystem sections replace it. Re-enable only
      # if a maintained, product-accurate architecture page is reintroduced.

      - name: Validate published version claims
        run: uv run python scripts/check_published_version_claims.py --offline

      - name: Run tests against generated source
        run: uv run pytest tests/ -q

      - name: Validate
        run: uv run python scripts/validate_docs.py

      - name: Build MkDocs site
        run: uv run mkdocs build --strict

      # Persist exactly the generated source that passed the gates before
      # publishing it. A protected-branch rejection therefore blocks deploy.
      # Skipped on push: no cross-repo sync ran, so there is nothing new to
      # persist and no second commit to push back to main.
      - name: Commit updated docs source
        if: ${{ success() && github.event_name != 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "Generated documentation is already current."
            exit 0
          fi
          git commit -m "docs: auto-sync documentation [skip ci]"

          # A cancelled dispatch can finish its push while the replacement is
          # already running. Rebase the exact generated commit onto that newer
          # main and retry the compare-and-swap push instead of losing the
          # replacement run to a harmless non-fast-forward race.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Docs main advanced during all three bounded push attempts." >&2
              exit 1
            fi
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
