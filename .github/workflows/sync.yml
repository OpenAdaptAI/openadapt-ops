name: Sync Documentation

on:
  # Same-repo docs merges publish directly, with no dispatch round-trip.
  # A push that only touches this repo's docs sources builds and deploys the
  # site as-is; the cross-repo content-sync steps below are skipped on push.
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/sync.yml'
  # Cross-repo content sync: sub-repos dispatch repo-updated (see trigger.yml)
  # when their README/changelog changes so their pages re-sync here.
  repository_dispatch:
    types: [repo-updated]
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 9 AM UTC
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repo to update (or "all" for full rebuild)'
        default: 'all'

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra llm --extra dev

      # Cross-repo content sync (pulls from OTHER repos): runs on
      # repository_dispatch / schedule / workflow_dispatch, but is skipped on a
      # same-repo push, which just builds and deploys this repo's docs as-is.
      - name: Sync READMEs
        if: ${{ success() && github.event_name != 'push' }}
        run: uv run python scripts/sync_readmes.py

      - name: Aggregate changelogs
        if: ${{ success() && github.event_name != 'push' }}
        run: uv run python scripts/aggregate_changelog.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate What's New
        if: ${{ success() && github.event_name != 'push' }}
        run: uv run python scripts/generate_whats_new.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The auto-generated architecture overview mirrored each repo README and
      # deep-linked to per-package pages that the docs site no longer publishes.
      # The curated Concepts and Ecosystem sections replace it. Re-enable only
      # if a maintained, product-accurate architecture page is reintroduced.

      - name: Run tests against generated source
        run: uv run pytest tests/ -q

      - name: Validate
        run: uv run python scripts/validate_docs.py

      - name: Build MkDocs site
        run: uv run mkdocs build --strict

      # Persist exactly the generated source that passed the gates before
      # publishing it. `main` is protected and takes changes only through a
      # pull request, so the generated commit goes to the workflow-owned
      # branch `docs/auto-sync` and lands through an auto-merging PR. Deploy
      # runs only after that PR exists, so published content is always content
      # that is queued for `main`. A failure to record the source therefore
      # still blocks deploy.
      #
      # Skipped on push: no cross-repo sync ran, so there is nothing new to
      # persist and no second commit to record.
      - name: Open a PR with the updated docs source
        id: docs_pr
        if: ${{ success() && github.event_name != 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: docs/auto-sync
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Generated documentation is already current."
            exit 0
          fi
          git commit -m "docs: auto-sync generated documentation"

          # The concurrency group serialises this workflow, and nothing else
          # writes this branch, so overwriting it rebases the pending sync onto
          # current main instead of stacking stale generated commits.
          git push --force origin "HEAD:refs/heads/${BRANCH}"

          cat > /tmp/docs-auto-sync-body.md <<'BODY'
          Automated. Only the `Sync Documentation` workflow writes this branch.

          It carries the regenerated `docs/` source: the synced READMEs, the
          aggregated changelog, and the What's New page. The run that opened it
          already ran the test suite, `scripts/validate_docs.py`, and a strict
          MkDocs build against exactly this content.

          Auto-merge (squash) is requested, so it lands once the required checks
          pass. If those checks never report, close and reopen this PR once:
          GitHub does not start a workflow for an event raised by the Actions
          token, and reopening it by hand does.

          Nothing here is hand-edited. To change it, change the generator under
          `scripts/`.
          BODY

          PR_URL=$(gh pr list --head "${BRANCH}" --base main --state open \
            --json url --jq '.[0].url // empty')
          if [ -z "${PR_URL}" ]; then
            PR_URL=$(gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "docs: auto-sync generated documentation" \
              --body-file /tmp/docs-auto-sync-body.md)
          fi
          if [ -z "${PR_URL}" ]; then
            echo "::error::Could not open the docs auto-sync PR."
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
          echo "Docs auto-sync PR: ${PR_URL}"

          # A repository without auto-merge, or a token that may not enable it,
          # must not fail the sync: the PR still exists for a person to merge.
          if ! gh pr merge --squash --auto "${PR_URL}"; then
            echo "::warning::Auto-merge is not enabled on ${PR_URL}; merge it by hand."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
